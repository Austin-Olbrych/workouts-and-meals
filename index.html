/* =========================================================

   written, and realtime updates keep every open device current.
   ========================================================= */
const SETTINGS_KEYS = ['profile', 'programs', 'activeProgramId', 'meals', 'supplements', 'programVersion'];
function stable(v) {
  if (v === null || typeof v !== 'object') return JSON.stringify(v === undefined ? null : v);
  if (Array.isArray(v)) return '[' + v.map(stable).join(',') + ']';
  return '{' + Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ':' + stable(v[k])).join(',') + '}';
}
const settingsOf = (s) => Object.fromEntries(SETTINGS_KEYS.map((k) => [k, s[k]]));
const normDay = (x) => ({
  workout: x.workout || null, food: x.food || [], water: x.water || [], supplements: x.supplements || {},
  weight: x.weight == null || x.weight === '' ? null : Number(x.weight),
});
const EMPTY_DAY = stable(normDay({}));
function dayOf(s, d) {
  const w = s.weights.find((x) => x.date === d);
  return normDay({ workout: s.workoutLogs[d], food: s.foodLog[d], water: s.water[d], supplements: s.suppLog[d], weight: w ? w.lbs : null });
}
function applyDay(s, d, day) {
  if (day.workout) s.workoutLogs[d] = day.workout; else delete s.workoutLogs[d];
  if (day.food.length) s.foodLog[d] = day.food; else delete s.foodLog[d];
  if (day.water.length) s.water[d] = day.water; else delete s.water[d];
  if (Object.keys(day.supplements).length) s.suppLog[d] = day.supplements; else delete s.suppLog[d];
  s.weights = s.weights.filter((w) => w.date !== d);
  if (day.weight != null) s.weights.push({ date: d, lbs: day.weight });
}
function snapshot(s) {
  const m = { settings: stable(settingsOf(s)) };
  const dates = new Set([...Object.keys(s.workoutLogs), ...Object.keys(s.foodLog), ...Object.keys(s.water), ...Object.keys(s.suppLog), ...s.weights.map((w) => w.date)]);
  dates.forEach((d) => { const v = stable(dayOf(s, d)); if (v !== EMPTY_DAY) m['day:' + d] = v; });
  return m;
}
function diffKeys(a, b) {
  const fb = (k) => (k === 'settings' ? undefined : EMPTY_DAY);
  const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  return [...keys].filter((k) => ((a || {})[k] ?? fb(k)) !== ((b || {})[k] ?? fb(k)));
}
const dayFromRow = (r) => normDay({ workout: r.workout, food: r.food, water: r.water, supplements: r.supplements, weight: r.weight_lbs });
function rowFromDay(d, day, now) {
  const t = day.food.reduce((a, x) => ({ cal: a.cal + x.cal * x.servings, p: a.p + x.p * x.servings, c: a.c + x.c * x.servings, f: a.f + x.f * x.servings }), { cal: 0, p: 0, c: 0, f: 0 });
  return {
    day: d, workout: day.workout, food: day.food, water: day.water, supplements: day.supplements, weight_lbs: day.weight,
    water_oz: Math.round(day.water.reduce((a, b) => a + num(b), 0)), calories: Math.round(t.cal), protein_g: Math.round(t.p),
    carbs_g: Math.round(t.c), fat_g: Math.round(t.f), workout_done: isWorkoutDone(day.workout), updated_at: now,
  };
}
function stateFromRows(setRow, rows) {
  const s = defaultState();

  if (d) {
    SETTINGS_KEYS.forEach((k) => { if (d[k] !== undefined && d[k] !== null) s[k] = d[k]; });
    if (!Array.isArray(s.programs) || !s.programs.length) { const p = defaultProgram(); s.programs = [p]; s.activeProgramId = p.id; }
    s.programVersion = d.programVersion || 1;
    s.profile = { ...defaultProfile(), ...(d.profile || {}) };
  }
  (rows || []).forEach((r) => applyDay(s, String(r.day).slice(0, 10), dayFromRow(r)));
  return s;
}

/* =========================================================
   Derived data
   ========================================================= */
const activeProgram = (s) => s.programs.find((p) => p.id === s.activeProgramId) || s.programs[0];
const dayTotals = (s, date) => (s.foodLog[date] || []).reduce((a, x) => ({
  cal: a.cal + x.cal * x.servings, p: a.p + x.p * x.servings, c: a.c + x.c * x.servings, f: a.f + x.f * x.servings,
}), { cal: 0, p: 0, c: 0, f: 0 });
const waterTotal = (s, date) => (s.water[date] || []).reduce((a, b) => a + b, 0);
const isWorkoutDone = (log) => !!log && (log.completed || (log.exercises || []).some((e) => e.sets.some((x) => x.done)) || !!(log.cardio && log.cardio.done));
const workoutsInWeek = (s, ws) => { let n = 0; for (let i = 0; i < 7; i++) if (isWorkoutDone(s.workoutLogs[addDays(ws, i)])) n++; return n; };
const latestWeight = (s) => { const w = [...s.weights].sort((a, b) => (a.date < b.date ? -1 : 1)); return w.length ? w[w.length - 1].lbs : num(s.profile.startWeight); };

function weekStreak(s, today) {
  const target = num(s.profile.workoutsPerWeek) || 5;
  let ws = weekStart(today), streak = 0;
  if (workoutsInWeek(s, ws) >= target) streak++;
  ws = addDays(ws, -7);
  for (let i = 0; i < 104 && workoutsInWeek(s, ws) >= target; i++) { streak++; ws = addDays(ws, -7); }
  return streak;
}
function hydrationStreak(s, today) {
  const goal = num(s.profile.waterGoal) || 100;
  let d = waterTotal(s, today) >= goal ? today : addDays(today, -1), n = 0;
  while (waterTotal(s, d) >= goal && n < 400) { n++; d = addDays(d, -1); }
  return n;
}

function calcTargets(profile, lbs) {
  const kg = lbs * 0.4536, cm = num(profile.heightIn) * 2.54;
  const bmr = 10 * kg + 6.25 * cm - 5 * num(profile.age) + (profile.sex === 'female' ? -161 : 5);
  const tdee = bmr * num(profile.activity);
  const adj = { cut: -450, maintain: 0, 'lean-bulk': 300 }[profile.goal] || 0;
  const bmi = num(profile.heightIn) ? (lbs / (num(profile.heightIn) ** 2)) * 703 : 0;
  if (profile.customTargets) {
    const c = profile.custom;
    return { bmr: Math.round(bmr), tdee: Math.round(tdee), cal: num(c.cal), p: num(c.p), c: num(c.c), f: num(c.f), bmi, custom: true };
  }
  const cal = Math.round((tdee + adj) / 10) * 10;
  const p = Math.round(lbs * (profile.goal === 'cut' ? 1.1 : 1.0));
  const f = Math.round((cal * 0.27) / 9);
  const c = Math.max(0, Math.round((cal - p * 4 - f * 9) / 4));
  return { bmr: Math.round(bmr), tdee: Math.round(tdee), cal, p, c, f, bmi, custom: false };
}

function lastPerformance(logs, ex, beforeDate) {
  const dates = Object.keys(logs).filter((d) => d < beforeDate).sort().reverse();
  for (const d of dates) {
    const x = (logs[d].exercises || []).find((y) => y.exId === ex.id || y.name === ex.name);
    if (x && x.sets.some((s) => s.done)) return { date: d, ...x };
  }
  return null;
}
function bestBefore(logs, name, beforeDate) {
  let best = 0;
  for (const d of Object.keys(logs)) {
    if (d >= beforeDate) continue;
    for (const ex of logs[d].exercises || []) {
      if (ex.name !== name) continue;
      for (const st of ex.sets) if (st.done) best = Math.max(best, e1rm(num(st.w), num(st.r)));
    }
  }
  return best;
}
function suggestion(logs, ex, date) {
  const last = lastPerformance(logs, ex, date);
  const base = !last && ex.baseline && Array.isArray(ex.baseline.r) && ex.baseline.r.length ? ex.baseline : null;
  if (!last && !base) return { weight: ex.weight, reps: ex.repMin, tone: 'neutral', text: ex.weight > 0 ? `Start at ${fmtW(ex.weight)} for ${ex.repMin}–${ex.repMax} reps.` : `Start with ${ex.repMin}–${ex.repMax} reps — enter your load and it’ll remember.` };
  const done = last ? last.sets.filter((s) => s.done) : base.r.map((r) => ({ w: num(base.w), r }));
  const lbl = last ? 'last time' : 'last cycle';
  const topW = Math.max(...done.map((s) => num(s.w)));
  const atTop = done.filter((s) => num(s.w) === topW);
  const lastStr = atTop.map((s) => s.r).join(' / ');
  const allMax = atTop.length >= ex.sets && atTop.every((s) => num(s.r) >= ex.repMax);
  const anyBelow = atTop.some((s) => num(s.r) < ex.repMin);
  const inc = num(ex.increment) || 5;
  if (allMax && topW > 0) return { weight: topW + inc, reps: ex.repMin, tone: 'up', text: `Hit ${lastStr} @ ${topW} ${lbl} — add ${inc} lb → ${topW + inc} lb.` };
  if (allMax) return { weight: 0, reps: ex.repMax, tone: 'up', text: `Maxed reps (${lastStr}) — add load or slow the tempo.` };
  if (anyBelow) return { weight: topW, reps: ex.repMin, tone: 'hold', text: `${lastStr} @ ${fmtW(topW)} ${lbl} — hold the weight and own ${ex.repMin}+ reps first.` };
  const minR = Math.min(...atTop.map((s) => num(s.r)));
  return { weight: topW, reps: Math.min(ex.repMax, minR + 1), tone: 'same', text: `${lastStr} @ ${fmtW(topW)} ${lbl} — same weight, beat it by a rep.` };
}

function draftSession(s, date, dk) {
  const prog = activeProgram(s);
  const day = prog.days[dk];
  return {
    dayKey: dk, title: day.title, programId: prog.id, completed: false,
    exercises: day.exercises.map((e) => {
      const sug = suggestion(s.workoutLogs, e, date);
      return { exId: e.id, name: e.name, muscle: e.muscle, sets: Array.from({ length: e.sets }, () => ({ w: sug.weight, r: sug.reps, done: false })) };
    }),
    cardio: day.type === 'cardio' ? { distance: '', minutes: '', done: false } : undefined,
  };
}

function computePRs(logs) {
  const best = {}, events = [];
  Object.keys(logs).sort().forEach((d) => {
    (logs[d].exercises || []).forEach((ex) => {
      ex.sets.forEach((st) => {
        if (!st.done) return;
        const v = e1rm(num(st.w), num(st.r));
        if (!v) return;
        const b = best[ex.name];
        if (!b || v > b.e1 + 0.01) {
          if (b) events.push({ name: ex.name, date: d, e1: v, w: num(st.w), r: num(st.r) });
          best[ex.name] = { name: ex.name, e1: v, w: num(st.w), r: num(st.r), date: d, muscle: ex.muscle };
        }
      });
    });
  });
  return { best, events };
}

function sessionStats(log) {
  let sets = 0, volume = 0;
  (log?.exercises || []).forEach((e) => e.sets.forEach((s) => { if (s.done) { sets++; volume += num(s.w) * num(s.r); } }));
  return { sets, volume };
}

function recommend(s, t, date) {
  const tot = dayTotals(s, date);
  const R = { cal: t.cal - tot.cal, p: t.p - tot.p, c: t.c - tot.c, f: t.f - tot.f };
  if (R.cal < 120 && R.p < 10) return { R, items: [] };
  const W = { p: 2.2, c: 1, f: 0.8 };
  const pool = [...s.meals.map((m) => ({ ...m, source: 'Your meal' })), ...FOOD_DB.map((m) => ({ ...m, source: 'Quick add' }))];
  const items = pool.map((x) => {
    let benefit = 0, penalty = 0;
    for (const k of ['p', 'c', 'f']) {
      const rem = Math.max(0, R[k]);
      benefit += (W[k] * Math.min(x[k], rem)) / (t[k] || 1);
      penalty += ((W[k] * Math.max(0, x[k] - rem)) / (t[k] || 1)) * 1.2;
    }
    penalty += (Math.max(0, x.cal - Math.max(0, R.cal)) / (t.cal || 1)) * 3;
    return { ...x, score: benefit - penalty };
  }).filter((x) => x.score > 0.02).sort((a, b) => b.score - a.score).slice(0, 6).map((x) => {
    let reason;
    if (R.p > 5 && x.p >= 10) reason = `Covers ${Math.round(Math.min(x.p, R.p))} g of your ${Math.round(R.p)} g protein gap`;
    else if (R.c > 5 && x.c >= 15) reason = `Adds ${Math.round(Math.min(x.c, R.c))} g of the ${Math.round(R.c)} g carbs left`;
    else if (R.f > 3 && x.f >= 8) reason = `Adds ${Math.round(Math.min(x.f, R.f))} g of the ${Math.round(R.f)} g fat left`;
    else reason = `Light ${x.cal} kcal top-up`;
    return { ...x, reason };
  });
  return { R, items };
}

function loadInitial() {
  const stored = storage.load();
  if (stored && stored.version === 1 && Array.isArray(stored.programs) && stored.programs.length) return normalize(stored);

    <div className={`${glass} p-4`}>
      <div className="flex items-center justify-between">
        <span className="text-xs font-medium text-zinc-300">{label}</span>
        {icon && <Icon name={icon} className="w-4 h-4 text-zinc-400" />}
      </div>
      <div className={`mt-2 text-2xl font-bold tabular-nums tracking-tight ${toneCls}`}>{value}{unit && <span className="text-sm font-medium text-zinc-400 ml-1">{unit}</span>}</div>
      {sub && <div className="mt-1 text-xs text-zinc-400">{sub}</div>}
    </div>
  );
}

                  {plan.exercises.map((e) => {
                    const sug = suggestion(state.workoutLogs, e, today);
                    return (
                      <li key={e.id} className="text-sm flex items-baseline justify-between gap-3 border-b border-white/5 pb-1.5">
                        <span className="text-zinc-200 truncate">{e.name}</span>

            <MacroBar label="Calories" value={tot.cal} goal={targets.cal} unit="" color="bg-purple-400" glow="shadow-[0_0_14px_rgba(192,132,252,.7)]" />

        {/* Weight */}

              <ResponsiveContainer width="100%" height="100%">
                <LineChart data={sortedW} margin={{ top: 4, right: 4, left: 4, bottom: 4 }}>
                  <YAxis hide domain={['dataMin - 0.5', 'dataMax + 0.5']} />

      </div>

      <Recommendations items={items.slice(0, 4)} R={R} targets={targets} onAdd={(x) => addFood(today, x)} />

  );

function QuickWeight({ state, update, toast, today }) {
  const [v, setV] = useState('');
  const save = (e) => {
    e.preventDefault();
    const lbs = Number(v);
    if (!lbs || lbs < 60 || lbs > 500) return;
    update((s) => { s.weights = s.weights.filter((w) => w.date !== today); s.weights.push({ date: today, lbs }); });
    setV(''); toast(`Logged ${lbs} lb for today`, 'good');
  };
  return (
    <form onSubmit={save} className="flex gap-2 mt-2">
      <input className={inputCls + ' !py-1.5'} type="number" step="0.1" inputMode="decimal" placeholder="Today’s weigh-in" value={v} onChange={(e) => setV(e.target.value)} aria-label="Today's weight in pounds" />
      <button className={btnGhost + ' !py-1.5'} type="submit">Log</button>
    </form>
  );
}

   WORKOUTS
   ========================================================= */
function WorkoutsView({ state, update, toast, today }) {
  const [date, setDate] = useState(today);
  const [edit, setEdit] = useState(false);
  const [dayOverride, setDayOverride] = useState(null);
  const [extraName, setExtraName] = useState('');
  useEffect(() => setDayOverride(null), [date]);

  const prog = activeProgram(state);
  const existing = state.workoutLogs[date];
  const dk = dayOverride || existing?.dayKey || dayKeyOf(date);
  const plan = prog.days[dk];
  const session = existing && existing.dayKey === dk ? existing : draftSession(state, date, dk);
  const logged = !!(existing && existing.dayKey === dk);
  const ws = weekStart(date);

  const mutate = (fn) => update((s) => {
    let log = s.workoutLogs[date];
    if (!log || log.dayKey !== dk) { log = draftSession(s, date, dk); s.workoutLogs[date] = log; }
    fn(log, s);
  });

  const toggleSet = (i, j) => {
    const ex = session.exercises[i], st = ex.sets[j], willDone = !st.done;
    mutate((log) => { log.exercises[i].sets[j].done = willDone; });
    if (willDone) {
      const best = bestBefore(state.workoutLogs, ex.name, date);
      const v = e1rm(num(st.w), num(st.r));
      if (best > 0 && v > best + 0.01) toast(`New PR · ${ex.name} ${num(st.w)} × ${num(st.r)} (est. 1RM ${Math.round(v)})`, 'pr');
    }
  };

  const complete = () => {
    mutate((log) => { log.completed = true; log.completedAt = Date.now(); });
    const s = sessionStats(session);
    toast(`${plan.title} logged · ${s.sets} sets, ${fmtInt(s.volume)} lb moved`, 'good');
  };

  const allSets = session.exercises.reduce((a, e) => a + (e.skipped ? 0 : e.sets.length), 0);
  const doneSets = session.exercises.reduce((a, e) => a + (e.skipped ? 0 : e.sets.filter((x) => x.done).length), 0);

  return (
    <div className="space-y-5">
      <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-3">
        <div>
          <h1 className="text-2xl sm:text-3xl font-bold tracking-tight">Workouts</h1>
          <p className="text-sm text-zinc-300 mt-1">Log sets as you go — weights pre-fill from your last session with the next progression.</p>
        </div>
        <div className="flex items-center gap-2 flex-wrap">
          {!edit && <DateNav date={date} setDate={setDate} today={today} />}
          <button className={edit ? btnPrimary : btnGhost} onClick={() => setEdit(!edit)}><Icon name={edit ? 'check' : 'edit'} className="w-4 h-4" />{edit ? 'Done editing' : 'Edit program'}</button>
        </div>
      </div>

      <ProgramBar state={state} update={update} toast={toast} edit={edit} />

      {/* Week strip */}
      <div className="flex gap-2 overflow-x-auto scrollbar-none -mx-1 px-1 pb-1">
        {DAY_KEYS.map((k, i) => {
          const d = addDays(ws, i);
          const day = prog.days[k];
          const sel = k === dk;
          const done = isWorkoutDone(state.workoutLogs[d]);
          return (
            <button key={k} onClick={() => setDayOverride(k)}
              className={`shrink-0 w-[7.5rem] text-left rounded-2xl border px-3 py-2.5 backdrop-blur-xl transition ${sel ? 'bg-white/10 border-violet-300/50 shadow-[0_0_20px_-6px_rgba(167,139,250,.6)]' : 'bg-zinc-900/40 border-white/10 hover:border-white/25'}`}>
              <div className="flex items-center justify-between">
                <span className={`text-[11px] font-semibold uppercase tracking-wider ${k === dayKeyOf(today) ? 'text-violet-300' : 'text-zinc-400'}`}>{k}</span>
                {done && !edit && <span className="w-4 h-4 rounded-full bg-violet-400/90 grid place-items-center"><Icon name="check" className="w-2.5 h-2.5 text-zinc-950" strokeWidth={3} /></span>}
              </div>
              <div className="text-sm font-semibold text-white truncate mt-0.5">{day.title}</div>
              <div className="text-[11px] text-zinc-400 truncate">{day.type === 'rest' ? 'Rest' : day.type === 'cardio' ? 'Cardio' : `${day.exercises.length} lifts`}</div>
            </button>
          );
        })}
      </div>

      <div className="grid lg:grid-cols-3 gap-5 items-start">
        <div className="lg:col-span-2 space-y-4">
          {edit ? (
            <DayEditor prog={prog} dk={dk} update={update} />
          ) : plan.type === 'rest' && !logged ? (
            <Card title={`${DAY_NAMES[dk]} · Rest day`} icon="moon" accent="text-indigo-300">
              <p className="text-sm text-zinc-300 whitespace-pre-line leading-relaxed">{plan.note || 'Muscle grows between sessions, not during them. An easy walk, some mobility, and hit your protein and water anyway.'}</p>
              <p className="text-sm text-zinc-400 mt-3">Training today instead? Pick a day above to log it on {fmtShort(date)}.</p>
            </Card>
          ) : (
            <>
              <div className={`${glass} p-4 flex flex-wrap items-center justify-between gap-3 ${session.completed ? 'pulse-glow' : ''}`}>
                <div>
                  <div className="text-xs text-zinc-300">{fmtLong(date)}</div>
                  <div className="text-lg font-bold">{plan.title} <span className="text-zinc-400 font-medium text-sm">· {plan.focus}</span></div>
                  {plan.note && <p className="text-xs text-amber-200/90 mt-1 max-w-xl leading-relaxed">{plan.note}</p>}
                </div>
                <div className="flex items-center gap-3">
                  <div className="text-right">
                    <div className={`text-lg font-bold tabular-nums ${doneSets === allSets && allSets ? 'text-violet-300 glow-violet' : ''}`}>{doneSets}/{allSets}</div>
                    <div className="text-[11px] text-zinc-400">sets</div>
                  </div>
                  {session.completed
                    ? <Chip tone="violet"><Icon name="check" className="w-3 h-3" /> Completed</Chip>
                    : <button className={btnPrimary} onClick={complete}><Icon name="check" className="w-4 h-4" />Finish workout</button>}
                </div>
              </div>

              {plan.type === 'cardio' && session.cardio && (
                <CardioBlock cardio={session.cardio} target={plan.cardioTarget} onChange={(patch) => mutate((log) => { log.cardio = { ...(log.cardio || {}), ...patch }; })} onDone={() => { const on = !session.cardio.done; mutate((log) => { log.cardio = { ...(log.cardio || {}), done: on }; }); if (on) toast('Run logged — nice work', 'good'); }} />
              )}

              {session.exercises.map((ex, i) => {
                const planEx = plan.exercises.find((p) => p.id === ex.exId);
                const ref = planEx || { id: ex.exId, name: ex.name };
                return (
                  <ExerciseCard key={ex.exId + i} ex={ex} idx={i} planEx={planEx}
                    last={lastPerformance(state.workoutLogs, ref, date)}
                    sug={planEx ? suggestion(state.workoutLogs, planEx, date) : null}
                    best={bestBefore(state.workoutLogs, ex.name, date)}
                    onSet={(j, field, v) => mutate((log) => { log.exercises[i].sets[j][field] = v; })}
                    onToggle={(j) => toggleSet(i, j)}
                    onAddSet={() => mutate((log) => { const sets = log.exercises[i].sets; const lastSet = sets[sets.length - 1] || { w: 0, r: 8 }; sets.push({ w: lastSet.w, r: lastSet.r, done: false }); })}
                    onRemoveSet={() => mutate((log) => { if (log.exercises[i].sets.length > 1) log.exercises[i].sets.pop(); })}
                    onRemove={!planEx ? () => mutate((log) => { log.exercises.splice(i, 1); }) : null}
                    onSkip={() => mutate((log) => { log.exercises[i].skipped = !log.exercises[i].skipped; })}
                  />
                );
              })}

              <div className={`${glass} p-4 flex flex-col sm:flex-row gap-2`}>
                <input className={inputCls} placeholder="Add an extra exercise to this session…" value={extraName} onChange={(e) => setExtraName(e.target.value)} list="exercise-list" />
                <button className={btnGhost} onClick={() => { if (!extraName.trim()) return; mutate((log) => { log.exercises.push({ exId: 'x-' + uid(), name: extraName.trim(), muscle: 'Other', sets: [0, 1, 2].map(() => ({ w: 0, r: 10, done: false })) }); }); setExtraName(''); }}><Icon name="plus" className="w-4 h-4" />Add</button>
                {logged && <ConfirmButton className={btnGhost} onConfirm={() => update((s) => { delete s.workoutLogs[date]; })} confirmText="Tap to reset">Reset to plan</ConfirmButton>}
              </div>
            </>
          )}
        </div>

        <div className="space-y-5">
          <VolumePanel prog={prog} />
          <PrinciplesCard />
        </div>
      </div>
      <datalist id="exercise-list">
        {['Back Squat', 'Front Squat', 'Hack Squat', 'Leg Press', 'Romanian Deadlift', 'Conventional Deadlift', 'Barbell Hip Thrust', 'Bulgarian Split Squat', 'Walking Lunge', 'Leg Extension', 'Seated Leg Curl', 'Lying Leg Curl', 'Standing Calf Raise', 'Seated Calf Raise', 'Barbell Bench Press', 'Incline Barbell Bench', 'Incline Dumbbell Press', 'Dumbbell Bench Press', 'Weighted Dip', 'Cable Fly (low to high)', 'Pec Deck', 'Machine Chest Press', 'Push-Up', 'Overhead Press', 'Seated DB Shoulder Press', 'Lateral Raise', 'Rear Delt Fly', 'Face Pull', 'Pull-Up', 'Lat Pulldown', 'Barbell Row', 'Seated Cable Row', 'Chest-Supported DB Row', 'EZ-Bar Curl', 'Hammer Curl', 'Rope Triceps Pushdown', 'Overhead Triceps Extension', 'Hanging Leg Raise', 'Cable Crunch', 'Plank'].map((n) => <option key={n} value={n} />)}
      </datalist>
    </div>
  );
}

function ExerciseCard({ ex, idx, planEx, last, sug, best, onSet, onToggle, onAddSet, onRemoveSet, onRemove, onSkip }) {
  if (ex.skipped) {
    return (
      <div className={`${glass} px-4 py-3 sm:px-5 flex items-center justify-between gap-3 opacity-60`}>
        <div className="flex items-center gap-2 min-w-0">
          <span className="text-xs text-zinc-500 tabular-nums font-semibold">{pad(idx + 1)}</span>
          <span className="font-medium text-zinc-300 line-through truncate">{ex.name}</span>
          <Chip>Skipped</Chip>
        </div>
        <button className={btnGhost + ' !px-2.5 !py-1 text-xs'} onClick={onSkip}>Undo</button>
      </div>
    );
  }
  const inc = num(planEx?.increment) || 5;
  const doneCount = ex.sets.filter((s) => s.done).length;
  const allDone = doneCount === ex.sets.length && ex.sets.length > 0;
  const toneCls = { up: 'border-violet-400/30 bg-violet-400/[0.07] text-violet-200', hold: 'border-amber-400/25 bg-amber-400/[0.06] text-amber-200', same: 'border-purple-400/25 bg-purple-400/[0.06] text-purple-100', neutral: 'border-white/10 bg-white/[0.03] text-zinc-300' };
  return (
    <div className={`${glass} p-4 sm:p-5 transition ${allDone ? '!border-violet-300/40' : ''}`}>
      <div className="flex items-start justify-between gap-3">
        <div className="min-w-0">
          <div className="flex items-center gap-2 flex-wrap">
            <span className="text-xs text-zinc-500 tabular-nums font-semibold">{pad(idx + 1)}</span>
            <h3 className="font-semibold text-white">{ex.name}</h3>
            <Chip tone={PRIORITY.includes(ex.muscle) ? 'violet' : 'zinc'}>{ex.muscle}</Chip>
            {planEx?.caution && <Chip tone="amber">Pain-free only</Chip>}
          </div>
          {planEx && <p className="text-sm text-zinc-300 mt-1">{planEx.sets} × {planEx.repMin}–{planEx.repMax} reps{planEx.notes && <span className="text-zinc-400"> · {planEx.notes}</span>}</p>}
        </div>
        <div className="flex items-start gap-2 shrink-0">
          <div className="text-right">
            <div className={`text-sm font-semibold tabular-nums ${allDone ? 'text-violet-300 glow-violet' : 'text-zinc-300'}`}>{doneCount}/{ex.sets.length}</div>
            <div className="text-[11px] text-zinc-400">sets</div>
          </div>
          {onSkip && <button className={btnGhost + ' !px-2.5 !py-1 text-xs'} onClick={onSkip} title="Skip this exercise today">Skip</button>}
          {onRemove && <button className={btnIcon + ' !w-8 !h-8'} aria-label="Remove exercise" onClick={onRemove}><Icon name="x" className="w-4 h-4" /></button>}
        </div>
      </div>

      {sug && (
        <div className={`mt-3 flex items-start gap-2 text-xs rounded-xl px-3 py-2 border ${toneCls[sug.tone]}`}>
          <Icon name={sug.tone === 'up' ? 'up' : sug.tone === 'hold' ? 'target' : 'sparkle'} className="w-3.5 h-3.5 mt-px shrink-0" />
          <span>{sug.text}</span>
        </div>
      )}

      <div className="mt-3 space-y-2">
        <div className="grid grid-cols-[1.5rem_1fr_1fr_2.75rem] gap-2 text-[10px] uppercase tracking-wider text-zinc-400 font-semibold px-0.5">
          <span>Set</span><span className="text-center">Weight · lb</span><span className="text-center">Reps</span><span className="text-center">Done</span>
        </div>
        {ex.sets.map((s, j) => {
          const v = e1rm(num(s.w), num(s.r));
          const pr = s.done && best > 0 && v > best + 0.01;
          return (
            <div key={j} className={`grid grid-cols-[1.5rem_1fr_1fr_2.75rem] gap-2 items-center rounded-xl ${s.done ? 'opacity-100' : ''}`}>
              <div className="relative text-center">
                <span className={`text-sm font-semibold tabular-nums ${s.done ? 'text-violet-300' : 'text-zinc-400'}`}>{j + 1}</span>
              </div>
              <Stepper label={`set ${j + 1} weight`} value={s.w} step={inc} onChange={(v2) => onSet(j, 'w', v2)} />
              <Stepper label={`set ${j + 1} reps`} value={s.r} step={1} onChange={(v2) => onSet(j, 'r', v2)} />
              <button aria-label={s.done ? `Mark set ${j + 1} not done` : `Mark set ${j + 1} done`} onClick={() => onToggle(j)}
                className={`relative h-10 rounded-xl border grid place-items-center transition ${s.done ? 'bg-violet-400 border-violet-300 text-zinc-950 shadow-[0_0_18px_-2px_rgba(167,139,250,.75)]' : 'bg-white/5 border-white/15 text-zinc-400 hover:text-white hover:bg-white/10'}`}>
                <Icon name="check" className="w-5 h-5" strokeWidth={2.6} />
                {pr && <span className="absolute -top-2 -right-1.5 rounded-full bg-purple-300 text-zinc-950 text-[9px] font-extrabold px-1.5 py-px shadow-[0_0_12px_rgba(192,132,252,.9)]">PR</span>}
              </button>
            </div>
          );
        })}
      </div>

      <div className="mt-3 flex items-center justify-between gap-2 flex-wrap">
        <div className="text-xs text-zinc-400 min-w-0">
          {last ? <>Last ({fmtShort(last.date)}): <span className="text-zinc-300 tabular-nums">{last.sets.filter((s) => s.done).map((s) => `${num(s.w) || 'BW'}×${s.r}`).join(', ')}</span></> : planEx?.baseline ? <>Last cycle: <span className="text-zinc-300 tabular-nums">{planEx.baseline.r.map((r) => `${num(planEx.baseline.w) || 'BW'}×${r}`).join(', ')}</span></> : 'No previous session logged'}
          {best > 0 && <span className="ml-2 text-purple-300/90">· best est. 1RM {Math.round(best)}</span>}
        </div>
        <div className="flex gap-1.5">
          <button className={btnGhost + ' !px-2.5 !py-1 text-xs'} onClick={onRemoveSet} disabled={ex.sets.length <= 1}><Icon name="minus" className="w-3.5 h-3.5" />Set</button>
          <button className={btnGhost + ' !px-2.5 !py-1 text-xs'} onClick={onAddSet}><Icon name="plus" className="w-3.5 h-3.5" />Set</button>
        </div>
      </div>
    </div>
  );
}

    <div className={`${glass} p-4 sm:p-5 ${cardio.done ? '!border-purple-300/40' : ''}`}>
      <div className="flex items-start justify-between gap-3">

          <span className="grid place-items-center w-9 h-9 rounded-xl bg-purple-400/10 border border-purple-300/30 text-purple-300"><Icon name="run" className="w-[18px] h-[18px]" /></span>

function DayEditor({ prog, dk, update }) {

  const setEx = (i, field, v) => setDay((d) => { d.exercises[i][field] = v; });
  const move = (i, dir) => setDay((d) => { const j = i + dir; if (j < 0 || j >= d.exercises.length) return; [d.exercises[i], d.exercises[j]] = [d.exercises[j], d.exercises[i]]; });
  const n = (v) => (v === '' ? '' : Number(v));
  return (
    <Card title={`Edit ${DAY_NAMES[dk]}`} subtitle="Changes apply to future sessions; logged days keep what you did." icon="edit">
      <div className="grid sm:grid-cols-3 gap-3">
        <div><label className={labelCls}>Day title</label><input className={inputCls} value={day.title} onChange={(e) => setDay((d) => { d.title = e.target.value; })} /></div>
        <div><label className={labelCls}>Focus</label><input className={inputCls} value={day.focus || ''} onChange={(e) => setDay((d) => { d.focus = e.target.value; })} /></div>
        <div><label className={labelCls}>Type</label>
          <select className={inputCls} value={day.type} onChange={(e) => setDay((d) => { d.type = e.target.value; if (e.target.value === 'cardio' && !d.cardioTarget) d.cardioTarget = '3 mi easy run'; })}>
            <option value="strength">Strength</option><option value="cardio">Cardio + lifts</option><option value="rest">Rest</option>
          </select>
        </div>
        <div className="sm:col-span-3"><label className={labelCls}>Day note</label><textarea className={inputCls + ' h-20'} value={day.note || ''} placeholder="Reminders for this day (shown above the workout)" onChange={(e) => setDay((d) => { d.note = e.target.value; })} /></div>
        {day.type === 'cardio' && <div className="sm:col-span-3"><label className={labelCls}>Cardio target</label><input className={inputCls} value={day.cardioTarget || ''} onChange={(e) => setDay((d) => { d.cardioTarget = e.target.value; })} /></div>}
      </div>

      {day.type !== 'rest' && (
        <div className="mt-5 space-y-3">
          {day.exercises.map((e, i) => (
            <div key={e.id} className="rounded-xl border border-white/10 bg-white/[0.03] p-3">
              <div className="flex gap-2 items-center">
                <span className="text-xs text-zinc-500 font-semibold tabular-nums w-5">{pad(i + 1)}</span>
                <input className={inputCls + ' font-semibold'} value={e.name} list="exercise-list" onChange={(ev) => setEx(i, 'name', ev.target.value)} aria-label="Exercise name" />
                <button className={btnIcon} aria-label="Move up" onClick={() => move(i, -1)}><Icon name="up" className="w-4 h-4" /></button>
                <button className={btnIcon} aria-label="Move down" onClick={() => move(i, 1)}><Icon name="down" className="w-4 h-4" /></button>
                <ConfirmButton className={btnIcon} confirmText="✕?" onConfirm={() => setDay((d) => { d.exercises.splice(i, 1); })}><Icon name="trash" className="w-4 h-4" /></ConfirmButton>
              </div>
              <div className="grid grid-cols-3 sm:grid-cols-6 gap-2 mt-2">
                <div><label className={labelCls}>Muscle</label><select className={inputCls} value={e.muscle} onChange={(ev) => setEx(i, 'muscle', ev.target.value)}>{MUSCLES.map((m) => <option key={m}>{m}</option>)}</select></div>
                <div><label className={labelCls}>Sets</label><input type="number" className={inputCls} value={e.sets} onChange={(ev) => setEx(i, 'sets', Math.max(1, num(ev.target.value)) )} /></div>
                <div><label className={labelCls}>Rep min</label><input type="number" className={inputCls} value={e.repMin} onChange={(ev) => setEx(i, 'repMin', n(ev.target.value))} /></div>
                <div><label className={labelCls}>Rep max</label><input type="number" className={inputCls} value={e.repMax} onChange={(ev) => setEx(i, 'repMax', n(ev.target.value))} /></div>
                <div><label className={labelCls}>Start lb</label><input type="number" className={inputCls} value={e.weight} onChange={(ev) => setEx(i, 'weight', n(ev.target.value))} /></div>
                <div><label className={labelCls}>+ Step lb</label><input type="number" className={inputCls} value={e.increment} onChange={(ev) => setEx(i, 'increment', n(ev.target.value))} /></div>

          <button className={btnGhost + ' w-full'} onClick={() => setDay((d) => { d.exercises.push(mk('New exercise', 'Chest', 3, 8, 12, 0, 5)); })}><Icon name="plus" className="w-4 h-4" />Add exercise</button>
        </div>
      )}
    </Card>
  );
}

function VolumePanel({ prog }) {
  const counts = {};
  DAY_KEYS.forEach((k) => prog.days[k].type !== 'rest' && prog.days[k].exercises.forEach((e) => { counts[e.muscle] = (counts[e.muscle] || 0) + num(e.sets); }));
  const rows = Object.entries(counts).sort((a, b) => (PRIORITY.includes(b[0]) - PRIORITY.includes(a[0])) || b[1] - a[1]);
  const max = 24;
  return (
    <Card title="Weekly sets per muscle" subtitle="Shaded band = 10–20 hard sets, the growth range" icon="target">
      <div className="space-y-2.5">
        {rows.map(([m, n]) => {
          const pri = PRIORITY.includes(m);
          const inBand = n >= 10 && n <= 20;
          return (
            <div key={m} className="grid grid-cols-[5.5rem_1fr_2rem] items-center gap-2">
              <span className={`text-xs ${pri ? 'text-white font-medium' : 'text-zinc-300'}`}>{m}</span>
              <div className="relative h-2.5 rounded-full bg-white/[0.06] overflow-hidden">

              </div>
              <span className={`text-xs tabular-nums text-right ${pri && inBand ? 'text-violet-300' : 'text-zinc-300'}`}>{n}</span>

      <p className="text-[11px] text-zinc-400 mt-3">Priority muscles in bright violet. Others sit lower on purpose so recovery goes to legs and chest.</p>

}

function NutritionWeekChart({ state, targets, today }) {
  const [metric, setMetric] = useState('p');
  const cfg = {
    p: { label: 'Protein', unit: ' g', goal: targets.p },
    cal: { label: 'Calories', unit: ' kcal', goal: targets.cal },
    water: { label: 'Water', unit: ' oz', goal: num(state.profile.waterGoal) || 100 },
  }[metric];
  const data = Array.from({ length: 14 }, (_, i) => {
    const d = addDays(today, i - 13);
    const v = metric === 'water' ? waterTotal(state, d) : Math.round(dayTotals(state, d)[metric]);
    return { label: fromKey(d).toLocaleDateString(undefined, { weekday: 'short' }).slice(0, 2), tipLabel: fmtLong(d), v, met: v >= cfg.goal * 0.95 };
  });
  const hits = data.filter((d) => d.met).length;
  return (
    <Card title="Last 14 days" subtitle={`${cfg.label} goal hit on ${hits} of 14 days`} icon="chart"
      action={<Segmented value={metric} onChange={setMetric} options={[{ value: 'p', label: 'Protein' }, { value: 'cal', label: 'Calories' }, { value: 'water', label: 'Water' }]} />}>
      <div className="flex items-center gap-4 text-[11px] text-zinc-300 mb-2">
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-violet-400" />Goal met</span>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-zinc-500" />Under goal</span>
        <span className="flex items-center gap-1.5"><span className="w-4 border-t border-dashed border-purple-300" />Goal {fmtInt(cfg.goal)}{cfg.unit}</span>
      </div>
      <div className="h-56">
        <ResponsiveContainer width="100%" height="100%">
          <BarChart data={data} margin={{ top: 8, right: 8, left: -8, bottom: 0 }} barCategoryGap="22%">
            <CartesianGrid stroke="rgba(255,255,255,0.06)" vertical={false} />
            <XAxis dataKey="label" tick={axisTick} axisLine={false} tickLine={false} interval={0} />
            <YAxis tick={axisTick} axisLine={false} tickLine={false} width={44} tickFormatter={(v) => fmtInt(v)} />
            <Tooltip cursor={{ fill: 'rgba(255,255,255,0.05)' }} content={<ChartTip unit={cfg.unit} names={{ v: cfg.label }} fmt={(v) => fmtInt(v)} />} />
            <ReferenceLine y={cfg.goal} stroke="#d8b4fe" strokeDasharray="4 4" strokeOpacity={0.8} />
            <Bar dataKey="v" radius={[4, 4, 0, 0]} maxBarSize={30}>
              {data.map((d, i) => <Cell key={i} fill={d.met ? '#a78bfa' : '#52525b'} />)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
    </Card>
  );
}

/* =========================================================

function ProgressView({ state, update, toast, today, targets, replaceState }) {
  const lw = latestWeight(state);
  const sortedW = [...state.weights].sort((a, b) => (a.date < b.date ? -1 : 1));
  const wAgo = sortedW.filter((w) => w.date <= addDays(today, -28)).slice(-1)[0];
  const delta = wAgo ? +(lw - wAgo.lbs).toFixed(1) : null;
  const weekCount = workoutsInWeek(state, weekStart(today));
  const streak = weekStreak(state, today);
  const { best, events } = useMemo(() => computePRs(state.workoutLogs), [state.workoutLogs]);
  const prs30 = events.filter((e) => e.date > addDays(today, -30)).length;
  const sessions30 = Object.keys(state.workoutLogs).filter((d) => d > addDays(today, -30) && isWorkoutDone(state.workoutLogs[d])).length;
  const goal = state.profile.goal;
  const goodDelta = delta == null ? false : goal === 'cut' ? delta < 0 : goal === 'lean-bulk' ? delta > 0 : Math.abs(delta) < 1;

  return (
    <div className="space-y-5">
      <div>
        <h1 className="text-2xl sm:text-3xl font-bold tracking-tight">Progress</h1>
        <p className="text-sm text-zinc-300 mt-1">Body weight, training consistency, personal records and your profile.</p>
      </div>

      <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
        <Stat label="Body weight" value={lw} unit="lb" icon="scale" tone={goodDelta ? 'violet' : 'white'} sub={delta == null ? `Started at ${state.profile.startWeight} lb` : `${delta > 0 ? '+' : ''}${delta} lb vs 4 weeks ago`} />
        <Stat label="This week" value={`${weekCount}/${state.profile.workoutsPerWeek}`} icon="calendar" tone={weekCount >= num(state.profile.workoutsPerWeek) ? 'violet' : 'white'} sub={`${sessions30} sessions in the last 30 days`} />
        <Stat label="Training streak" value={streak} unit={streak === 1 ? 'week' : 'weeks'} icon="flame" tone={streak > 0 ? 'violet' : 'white'} sub={`Weeks hitting ${state.profile.workoutsPerWeek}+ sessions`} />
        <Stat label="New PRs" value={prs30} unit="in 30 days" icon="trophy" tone={prs30 > 0 ? 'purple' : 'white'} sub={`${Object.keys(best).length} lifts tracked`} />
      </div>

      <div className="grid lg:grid-cols-3 gap-5 items-start">
        <WeightCard state={state} update={update} toast={toast} today={today} className="lg:col-span-2" />
        <ProfileCard state={state} update={update} targets={targets} lw={lw} />
      </div>

      <div className="grid lg:grid-cols-2 gap-5">
        <VolumeChart state={state} today={today} />
        <Heatmap state={state} today={today} />
      </div>

      <div className="grid lg:grid-cols-3 gap-5 items-start">
        <PRBoard best={best} events={events} className="lg:col-span-2" />
        <DataCard state={state} update={update} toast={toast} today={today} replaceState={replaceState} />
      </div>
    </div>
  );
}

function WeightCard({ state, update, toast, today, className }) {
  const [range, setRange] = useState(90);
  const [v, setV] = useState('');
  const [d, setD] = useState(today);
  const goal = num(state.profile.targetWeight) || null;
  const sorted = [...state.weights].sort((a, b) => (a.date < b.date ? -1 : 1));
  const cutoff = range ? addDays(today, -range) : '0000-00-00';
  const data = sorted.filter((w) => w.date >= cutoff).map((w) => {
    const win = sorted.filter((x) => x.date <= w.date && x.date > addDays(w.date, -7));
    const avg = win.reduce((a, b) => a + b.lbs, 0) / win.length;
    return { label: fmtShort(w.date), tipLabel: fmtLong(w.date), lbs: w.lbs, avg: +avg.toFixed(1) };
  });
  const vals = data.map((x) => x.lbs).concat(goal ? [goal] : []);
  const lo = vals.length ? Math.floor(Math.min(...vals) - 1) : 160, hi = vals.length ? Math.ceil(Math.max(...vals) + 1) : 190;
  const save = (e) => {
    e.preventDefault();
    const lbs = Number(v);
    if (!lbs || lbs < 60 || lbs > 500) return;
    update((s) => { s.weights = s.weights.filter((w) => w.date !== d); s.weights.push({ date: d, lbs }); });
    toast(`Logged ${lbs} lb for ${d === today ? 'today' : fmtShort(d)}`, 'good'); setV('');
  };
  return (
    <Card className={className} title="Body weight" subtitle={goal ? `Goal ${goal} lb · line shows your 7-day average` : 'Line shows your 7-day average — set a goal weight in your profile'} icon="scale"
      action={<Segmented value={range} onChange={setRange} options={[{ value: 30, label: '30d' }, { value: 90, label: '90d' }, { value: 0, label: 'All' }]} />}>
      <div className="flex items-center gap-4 text-[11px] text-zinc-300 mb-2">
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-full bg-zinc-400" />Weigh-in</span>
        <span className="flex items-center gap-1.5"><span className="w-4 h-0.5 rounded bg-violet-400" />7-day average</span>
        {goal && <span className="flex items-center gap-1.5"><span className="w-4 border-t border-dashed border-purple-300" />Goal</span>}
      </div>
      <div className="h-60">
        {data.length ? (
          <ResponsiveContainer width="100%" height="100%">
            <LineChart data={data} margin={{ top: 8, right: 12, left: -8, bottom: 0 }}>
              <CartesianGrid stroke="rgba(255,255,255,0.06)" vertical={false} />
              <XAxis dataKey="label" tick={axisTick} axisLine={false} tickLine={false} minTickGap={28} />
              <YAxis domain={[lo, hi]} tick={axisTick} axisLine={false} tickLine={false} width={40} allowDecimals={false} />
              <Tooltip cursor={{ stroke: 'rgba(255,255,255,0.25)' }} content={<ChartTip unit=" lb" names={{ lbs: 'Weigh-in', avg: '7-day avg' }} colors={{ lbs: '#a1a1aa', avg: '#a78bfa' }} />} />
              {goal && <ReferenceLine y={goal} stroke="#d8b4fe" strokeDasharray="4 4" />}
              <Line dataKey="lbs" stroke="#a1a1aa" strokeWidth={0} dot={{ r: 4, fill: '#a1a1aa', stroke: '#18181b', strokeWidth: 2 }} activeDot={{ r: 6, fill: '#e4e4e7', stroke: '#18181b', strokeWidth: 2 }} isAnimationActive={false} />
              <Line type="monotone" dataKey="avg" stroke="#a78bfa" strokeWidth={2} dot={false} activeDot={{ r: 5, fill: '#a78bfa', stroke: '#18181b', strokeWidth: 2 }} style={{ filter: 'drop-shadow(0 0 6px rgba(167,139,250,.55))' }} />
            </LineChart>
          </ResponsiveContainer>
        ) : <div className="h-full grid place-items-center text-sm text-zinc-400">Log a weigh-in to start the chart.</div>}
      </div>
      <form onSubmit={save} className="mt-4 flex flex-wrap gap-2 items-end">
        <div className="flex-1 min-w-[8rem]"><label className={labelCls}>Weight (lb)</label><input className={inputCls} type="number" step="0.1" inputMode="decimal" value={v} onChange={(e) => setV(e.target.value)} placeholder="175.0" /></div>
        <div className="flex-1 min-w-[8rem]"><label className={labelCls}>Date</label><input className={inputCls} type="date" value={d} max={today} onChange={(e) => setD(e.target.value || today)} /></div>
        <button type="submit" className={btnPrimary}><Icon name="plus" className="w-4 h-4" />Log weight</button>
      </form>
    </Card>
  );
}

            <input type="checkbox" className="accent-violet-400" checked={!!p.customTargets} onChange={(e) => update((s) => { s.profile.customTargets = e.target.checked; if (e.target.checked) s.profile.custom = { cal: targets.cal, p: targets.p, c: targets.c, f: targets.f }; })} />
            Set my own
          </label>
        </div>
        {p.customTargets ? (
          <div className="grid grid-cols-4 gap-2 mt-2">
            {[['cal', 'kcal'], ['p', 'Protein'], ['c', 'Carbs'], ['f', 'Fat']].map(([k, l]) => (
              <div key={k}><label className="block text-[10px] text-zinc-400 mb-1">{l}</label><input type="number" className={inputCls + ' !px-2'} value={p.custom[k]} onChange={(e) => update((s) => { s.profile.custom[k] = n(e.target.value); })} /></div>
            ))}
          </div>
        ) : (
          <div className="grid grid-cols-4 gap-2 mt-2 text-center">
            {[['kcal', targets.cal, 'text-white'], ['Protein', targets.p + 'g', 'text-violet-300'], ['Carbs', targets.c + 'g', 'text-purple-300'], ['Fat', targets.f + 'g', 'text-indigo-300']].map(([l, v, c]) => (
              <div key={l}><div className={`text-sm font-bold tabular-nums ${c}`}>{typeof v === 'number' ? fmtInt(v) : v}</div><div className="text-[10px] text-zinc-400">{l}</div></div>
            ))}
          </div>
        )}
        <div className="mt-2 text-[11px] text-zinc-400 leading-relaxed">
          BMR {fmtInt(targets.bmr)} · maintenance ≈ {fmtInt(targets.tdee)} kcal · BMI {targets.bmi.toFixed(1)} at {lw} lb.
          {!p.customTargets && ' Protein set at 1 g per lb of body weight; fat ~27% of calories; carbs fill the rest.'}
        </div>
      </div>
    </Card>
  );
}

function VolumeChart({ state, today }) {
  const ws0 = weekStart(today);
  const data = Array.from({ length: 8 }, (_, i) => {
    const ws = addDays(ws0, (i - 7) * 7);
    let vol = 0, sessions = 0, sets = 0;
    for (let k = 0; k < 7; k++) { const log = state.workoutLogs[addDays(ws, k)]; if (isWorkoutDone(log)) { sessions++; const st = sessionStats(log); vol += st.volume; sets += st.sets; } }
    return { label: fmtShort(ws), tipLabel: `Week of ${fmtShort(ws)}${i === 7 ? ' (this week)' : ''}`, vol: Math.round(vol), tipExtra: `${sessions} sessions · ${sets} working sets`, current: i === 7 };
  });
  const prev = data[6].vol, avg = data.slice(2, 6).reduce((a, b) => a + b.vol, 0) / 4;
  const up = avg ? Math.round(((prev - avg) / avg) * 100) : 0;
  return (
    <Card title="Weekly training volume" subtitle={`Pounds moved (weight × reps). Last full week ${up >= 0 ? '+' : ''}${up}% vs the 4 weeks before`} icon="chart" accent="text-purple-300">
      <div className="h-60">
        <ResponsiveContainer width="100%" height="100%">
          <BarChart data={data} margin={{ top: 8, right: 8, left: -4, bottom: 0 }} barCategoryGap="28%">
            <CartesianGrid stroke="rgba(255,255,255,0.06)" vertical={false} />
            <XAxis dataKey="label" tick={axisTick} axisLine={false} tickLine={false} interval={0} />
            <YAxis tick={axisTick} axisLine={false} tickLine={false} width={44} tickFormatter={(v) => (v >= 1000 ? `${Math.round(v / 1000)}k` : v)} />
            <Tooltip cursor={{ fill: 'rgba(255,255,255,0.05)' }} content={<ChartTip unit=" lb" names={{ vol: 'Volume' }} fmt={(v) => fmtInt(v)} />} />
            <Bar dataKey="vol" radius={[4, 4, 0, 0]} maxBarSize={34}>
              {data.map((d, i) => <Cell key={i} fill={d.current ? 'rgba(192,132,252,0.45)' : '#c084fc'} />)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
      <p className="text-[11px] text-zinc-400 mt-1">Lighter bar = this week, still in progress.</p>
    </Card>
  );
}

function Heatmap({ state, today }) {
  const start = addDays(weekStart(today), -7 * 15);
  const weeks = Array.from({ length: 16 }, (_, w) => Array.from({ length: 7 }, (_, d) => addDays(start, w * 7 + d)));
  const prog = activeProgram(state);
  let total = 0;
  weeks.flat().forEach((d) => { if (isWorkoutDone(state.workoutLogs[d])) total++; });
  return (
    <Card title="Consistency" subtitle={`${total} sessions in the last 16 weeks`} icon="calendar">
      <div className="flex gap-2">
        <div className="grid gap-1 text-[10px] text-zinc-500 pr-1" style={{ gridTemplateRows: 'repeat(7, minmax(0, 1fr))' }}>
          {DAY_KEYS.map((k, i) => <span key={k} className="leading-none flex items-center">{i % 2 === 0 ? k : ''}</span>)}
        </div>
        <div className="flex-1 grid gap-1" style={{ gridTemplateColumns: 'repeat(16, minmax(0, 1fr))' }}>
          {weeks.map((wk, wi) => (
            <div key={wi} className="grid gap-1" style={{ gridTemplateRows: 'repeat(7, minmax(0, 1fr))' }}>
              {wk.map((d) => {
                const log = state.workoutLogs[d];
                const done = isWorkoutDone(log);
                const future = d > today;
                const cardio = done && (log.cardio || prog.days[log.dayKey]?.type === 'cardio');
                const cls = future ? 'bg-transparent border border-white/5' : done ? (cardio ? 'bg-purple-400 shadow-[0_0_8px_rgba(192,132,252,.6)]' : 'bg-violet-400 shadow-[0_0_8px_rgba(167,139,250,.6)]') : 'bg-white/[0.06]';
                return <div key={d} title={`${fmtLong(d)}${done ? ' · ' + (log.title || 'Workout') : ''}`} className={`aspect-square rounded-[4px] ${cls} ${d === today ? 'ring-1 ring-white/70' : ''}`} />;
              })}
            </div>
          ))}
        </div>
      </div>
      <div className="flex items-center gap-4 text-[11px] text-zinc-300 mt-3">
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-violet-400" />Lifting</span>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-purple-400" />Run day</span>
        <span className="flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm bg-white/10" />Rest / missed</span>
      </div>
    </Card>
  );
}

      {rows.length ? (

          <table className="w-full text-sm">

              <th className="font-semibold py-2 px-1">Lift</th><th className="font-semibold py-2 px-1 text-right">Best set</th><th className="font-semibold py-2 px-1 text-right">Est. 1RM</th><th className="font-semibold py-2 px-1 text-right">Date</th>

                  <td className="py-2 px-1 text-right tabular-nums text-zinc-300">{r.w} × {r.r}</td>

function DataCard({ state, update, toast, today, replaceState }) {
  const [paste, setPaste] = useState('');
  const fileRef = useRef(null);
  const json = () => JSON.stringify(state);
  const doImport = (text) => {
    try {
      const obj = JSON.parse(text);
      if (obj.version !== 1 || !Array.isArray(obj.programs)) throw new Error('bad');
      replaceState(obj); toast('Backup restored', 'good'); setPaste('');
    } catch (e) { toast('That doesn’t look like a dashboard backup', 'warn'); }
  };
  const download = () => {
    try {
      const blob = new Blob([json()], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = `workouts-and-meals-${today}.json`;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1500);
    } catch (e) { toast('Download blocked here — use Copy instead', 'warn'); }
  };
  const copy = async () => { try { await navigator.clipboard.writeText(json()); toast('Backup copied to clipboard', 'info'); } catch (e) { toast('Clipboard blocked — use Download', 'warn'); } };
  return (
    <Card title="Data & backup" subtitle="Everything saves to your database as you go — download a copy any time" icon="download" accent="text-zinc-300">
      <div className="grid grid-cols-2 gap-2">
        <button className={btnGhost} onClick={download}><Icon name="download" className="w-4 h-4" />Download</button>
        <button className={btnGhost} onClick={copy}><Icon name="copy" className="w-4 h-4" />Copy</button>
        <button className={btnGhost + ' col-span-2'} onClick={() => fileRef.current?.click()}><Icon name="upload" className="w-4 h-4" />Restore from file</button>
        <input ref={fileRef} type="file" accept="application/json,.json" className="hidden" onChange={(e) => { const f = e.target.files?.[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.readAsText(f); e.target.value = ''; }} />
      </div>
      <textarea className={inputCls + ' mt-2 h-16 text-xs font-mono'} placeholder="…or paste a backup here" value={paste} onChange={(e) => setPaste(e.target.value)} />
      {paste && <button className={btnGhost + ' w-full mt-2'} onClick={() => doImport(paste)}>Restore pasted backup</button>}
      <div className="mt-4 pt-4 border-t border-white/10 space-y-2">
        <ConfirmButton className={btnGhost + ' w-full'} confirmText="Tap again — deletes all logs from the database" onConfirm={() => { update((s) => { s.workoutLogs = {}; s.weights = []; s.foodLog = {}; s.water = {}; s.suppLog = {}; }); toast('All logs cleared', 'info'); }}>Clear all logs (keeps program & meals)</ConfirmButton>
        <ConfirmButton className={btnGhost + ' w-full !text-zinc-400'} confirmText="Tap again — resets everything" onConfirm={() => { replaceState(defaultState()); toast('Reset to defaults', 'info'); }}>Reset everything</ConfirmButton>
      </div>
    </Card>
  );
}

function App() {
  const [state, setState] = useState(loadInitial);
  const [tab, setTab] = useState(readHash);
  const [toasts, setToasts] = useState([]);
  const today = todayKey();

  useEffect(() => { const t = setTimeout(() => storage.save(state), 250); return () => clearTimeout(t); }, [state]);
  useEffect(() => { const h = () => setTab(readHash()); window.addEventListener('hashchange', h); return () => window.removeEventListener('hashchange', h); }, []);

  const update = useCallback((fn) => setState((s) => { const n = structuredClone(s); fn(n); return n; }), []);
  const replaceState = useCallback((obj) => { setState(normalize(obj)); }, []);
  const toast = useCallback((text, tone = 'good') => {
    const id = uid();
    setToasts((t) => [...t.slice(-3), { id, text, tone }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3200);
  }, []);

  /* ---------- Live database (Supabase) ---------- */
  const [sync, setSync] = useState(sb ? 'connecting' : 'offline');
  const [syncMsg, setSyncMsg] = useState(sb ? '' : 'The database library didn’t load — changes are kept on this device until it does.');
  const [statusOpen, setStatusOpen] = useState(false);
  const stateRef = useRef(state);
  stateRef.current = state;
  const baseRef = useRef(null);          // what this device started with (catches edits made before the first load)
  if (baseRef.current === null) baseRef.current = snapshot(state);
  const syncedRef = useRef({});          // what the database currently holds
  const readyRef = useRef(false);
  const flushingRef = useRef(false);
  const retryRef = useRef(null);

  const flush = useCallback(async () => {
    if (!sb || !readyRef.current || flushingRef.current) return;
    const s = stateRef.current, snap = snapshot(s);
    const keys = diffKeys(syncedRef.current, snap);
    if (!keys.length) { setSync('live'); return; }
    flushingRef.current = true; setSync('saving');
    let ok = false;
    try {
      const now = new Date().toISOString();
      if (keys.includes('settings')) {
        const { error } = await sb.from('app_settings').upsert({ id: 'main', data: settingsOf(s), updated_at: now });
        if (error) throw error;
      }
      const days = keys.filter((k) => k !== 'settings').map((k) => k.slice(4));
      if (days.length) {
        const { error } = await sb.from('daily_logs').upsert(days.map((d) => rowFromDay(d, dayOf(s, d), now)));
        if (error) throw error;
      }
      keys.forEach((k) => { if (snap[k] === undefined) delete syncedRef.current[k]; else syncedRef.current[k] = snap[k]; });
      setSync('live'); setSyncMsg(''); ok = true;
    } catch (err) {
      setSync('error'); setSyncMsg(describeSbError(err));
      clearTimeout(retryRef.current); retryRef.current = setTimeout(() => flush(), 10000);
    } finally { flushingRef.current = false; }
    if (ok && diffKeys(syncedRef.current, snapshot(stateRef.current)).length) setTimeout(() => flush(), 300);
  }, []);

  const load = useCallback(async () => {
    if (!sb) return;
    try {
      const [setRes, dayRes] = await Promise.all([
        sb.from('app_settings').select('data').eq('id', 'main').maybeSingle(),
        sb.from('daily_logs').select('*').order('day', { ascending: true }).limit(5000),
      ]);
      if (setRes.error) throw setRes.error;
      if (dayRes.error) throw dayRes.error;
      const dbState = stateFromRows(setRes.data, dayRes.data);
      const dbSnap = snapshot(dbState);
      if (!setRes.data) delete dbSnap.settings; // first run: this device's program/meals/targets get written
      const local = stateRef.current;
      const pending = diffKeys(readyRef.current ? syncedRef.current : baseRef.current, snapshot(local));
      const merged = structuredClone(dbState);
      if (!setRes.data || pending.includes('settings')) SETTINGS_KEYS.forEach((k) => { merged[k] = structuredClone(local[k]); });
      pending.filter((k) => k !== 'settings').forEach((k) => applyDay(merged, k.slice(4), dayOf(local, k.slice(4))));
      migrate(merged); // differs from dbSnap, so the new program gets written back
      syncedRef.current = dbSnap;
      readyRef.current = true;
      setState(merged);
      setSync('live'); setSyncMsg('');
      setTimeout(() => flush(), 60);
    } catch (err) {
      setSync(readyRef.current ? 'error' : 'offline'); setSyncMsg(describeSbError(err));
      clearTimeout(retryRef.current); retryRef.current = setTimeout(() => load(), 15000);
    }
  }, [flush]);

  useEffect(() => { load(); }, [load]);
  useEffect(() => {
    if (!readyRef.current) return;
    const t = setTimeout(() => flush(), 500);
    return () => clearTimeout(t);
  }, [state, flush]);

  useEffect(() => {
    if (!sb) return;
    // Another device saved a day → apply it here, unless this device has its own unsaved edit to that day.
    const onDay = (p) => {
      const row = p.new;
      if (!row || !row.day || !readyRef.current) return;
      const d = String(row.day).slice(0, 10), k = 'day:' + d;
      const remote = dayFromRow(row), rs = stable(remote);
      const synced = syncedRef.current[k] ?? EMPTY_DAY;
      if (rs === synced) return;
      if (stable(dayOf(stateRef.current, d)) !== synced) return;
      if (rs === EMPTY_DAY) delete syncedRef.current[k]; else syncedRef.current[k] = rs;
      setState((s) => { const n = structuredClone(s); applyDay(n, d, remote); return n; });
    };
    const onSettings = (p) => {
      const row = p.new;
      if (!row || !row.data || !readyRef.current) return;
      const remote = stateFromRows(row, []);
      const rs = stable(settingsOf(remote));
      if (rs === syncedRef.current.settings) return;
      if (stable(settingsOf(stateRef.current)) !== syncedRef.current.settings) return;
      syncedRef.current.settings = rs;
      setState((s) => { const n = structuredClone(s); SETTINGS_KEYS.forEach((k) => { n[k] = remote[k]; }); return n; });
    };
    let ch = null;
    try {
      ch = sb.channel('wm-live')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'daily_logs' }, onDay)
        .on('postgres_changes', { event: '*', schema: 'public', table: 'app_settings' }, onSettings)
        .subscribe();
    } catch (e) {}
    const refresh = () => { if (document.visibilityState === 'visible') load(); };
    document.addEventListener('visibilitychange', refresh);
    window.addEventListener('online', refresh);
    return () => {
      try { if (ch) sb.removeChannel(ch); } catch (e) {}
      document.removeEventListener('visibilitychange', refresh);
      window.removeEventListener('online', refresh);
    };
  }, [load]);

  const go = (t) => { setTab(t); try { window.location.hash = t; } catch (e) {} window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const lw = latestWeight(state);
  const targets = useMemo(() => calcTargets(state.profile, lw), [state.profile, lw]);

  const addWater = (date, oz) => {
    const before = waterTotal(state, date), goal = num(state.profile.waterGoal) || 100;
    update((s) => { (s.water[date] ||= []).push(oz); });
    if (before < goal && before + oz >= goal) toast(`Water goal hit — ${before + oz} oz`, 'good');
  };
  const addFood = (date, item) => {
    const before = dayTotals(state, date).p;
    update((s) => { (s.foodLog[date] ||= []).push(entryFrom(item)); });
    if (before < targets.p && before + item.p >= targets.p) toast(`Protein goal hit — ${Math.round(before + item.p)} g`, 'good');
    else toast(`Logged ${item.name}`, 'info');
  };
  const toggleSupp = (date, sp) => {
    const on = !!state.suppLog[date]?.[sp.id];
    update((s) => {
      s.suppLog[date] ||= {};
      s.suppLog[date][sp.id] = !on;
      if (sp.mealId) {
        s.foodLog[date] ||= [];
        if (!on) { const m = s.meals.find((x) => x.id === sp.mealId); if (m) s.foodLog[date].push(entryFrom(m, { auto: sp.id })); }
        else s.foodLog[date] = s.foodLog[date].filter((e) => e.auto !== sp.id);
      }
    });
    if (!on) {
      const doneAfter = state.supplements.filter((x) => x.id === sp.id || state.suppLog[date]?.[x.id]).length;
      toast(doneAfter === state.supplements.length ? 'All supplements in for the day ✓' : `${sp.name} ✓`, 'good');
    }
  };

  const shared = { state, update, toast, today, targets, toggleSupp, addWater, addFood };

  return (
    <div className="relative min-h-screen">
      <Background />
      <div className="relative z-10">
        <header className="sticky top-0 z-40 px-3 sm:px-6 pt-3">
          <nav className={`${glass} max-w-7xl mx-auto flex items-center gap-3 px-3 sm:px-4 py-2.5`}>
            <a href="#today" onClick={(e) => { e.preventDefault(); go('today'); }} className="flex items-center gap-2.5 shrink-0">
              <span className="grid place-items-center w-9 h-9 rounded-xl bg-gradient-to-br from-violet-500 to-purple-500 text-white shadow-[0_0_20px_-4px_rgba(167,139,250,.8)]"><Icon name="dumbbell" className="w-5 h-5" strokeWidth={2.2} /></span>
              <span className="font-bold tracking-tight text-[15px] leading-tight">Workouts<span className="text-violet-300"> & </span>Meals</span>
            </a>
            <div className="hidden md:flex items-center gap-1 ml-6">
              {NAV.map((n) => (
                <button key={n.id} onClick={() => go(n.id)} className={`flex items-center gap-2 rounded-xl px-3.5 py-2 text-sm font-medium transition ${tab === n.id ? 'bg-white/10 text-white shadow-[inset_0_1px_0_rgba(255,255,255,.14)]' : 'text-zinc-300 hover:text-white hover:bg-white/5'}`}>
                  <Icon name={n.icon} className={`w-4 h-4 ${tab === n.id ? 'text-violet-300' : ''}`} />{n.label}
                </button>
              ))}
            </div>
            <div className="ml-auto flex items-center gap-3">
              <div className="text-xs text-zinc-300 hidden lg:block">{fmtLong(today)}</div>
              <LivePill sync={sync} onClick={() => setStatusOpen(true)} />
            </div>
          </nav>
        </header>

        <main className="max-w-7xl mx-auto px-3 sm:px-6 pt-6 pb-28 md:pb-12">
          {tab === 'today' && <TodayView {...shared} go={go} />}
          {tab === 'workouts' && <WorkoutsView {...shared} />}
          {tab === 'nutrition' && <NutritionView {...shared} />}
          {tab === 'progress' && <ProgressView {...shared} replaceState={replaceState} />}
        </main>

        <nav className={`md:hidden fixed bottom-3 left-3 right-3 z-40 ${glass} grid grid-cols-4 p-1.5`} style={{ paddingBottom: 'max(0.375rem, env(safe-area-inset-bottom))' }}>
          {NAV.map((n) => (
            <button key={n.id} onClick={() => go(n.id)} className={`flex flex-col items-center gap-0.5 rounded-xl py-2 text-[11px] font-medium transition ${tab === n.id ? 'bg-white/10 text-white' : 'text-zinc-400'}`}>
              <Icon name={n.icon} className={`w-5 h-5 ${tab === n.id ? 'text-violet-300' : ''}`} />{n.label}
            </button>
          ))}
        </nav>
      </div>
      <Toasts toasts={toasts} />
      {statusOpen && <StatusModal sync={sync} syncMsg={syncMsg} onClose={() => setStatusOpen(false)} onRetry={() => { load(); }} />}
    </div>
  );
}

function describeSbError(err) {
  const msg = String(err?.message || err || '');
  if (err?.code === '42P01' || err?.code === 'PGRST205' || /does not exist|schema cache|Could not find the table/i.test(msg))
    return 'The database tables aren’t set up yet — run supabase/schema.sql in Supabase → SQL Editor. Changes are kept on this device until then.';
  if (/Failed to fetch|NetworkError|Load failed|fetch/i.test(msg))
    return 'Can’t reach the database (offline, or blocked in the Claude preview). Changes are kept on this device and save automatically once it’s reachable.';
  if (/row-level security|permission denied/i.test(msg)) return 'The database refused the write. Re-run supabase/schema.sql to restore its access rules.';
  return msg || 'Unknown database error';
}

function LivePill({ sync, onClick }) {
  const cfg = {
    connecting: { text: 'Connecting…', dot: 'bg-violet-300 animate-pulse', cls: 'border-white/15 text-zinc-200' },
    live: { text: 'Live', dot: 'bg-violet-400 shadow-[0_0_8px_rgba(167,139,250,.95)]', cls: 'border-violet-300/30 text-violet-200 hover:bg-violet-400/10' },
    saving: { text: 'Saving…', dot: 'bg-violet-300 animate-pulse', cls: 'border-white/15 text-zinc-200' },
    offline: { text: 'Offline', dot: 'bg-zinc-500', cls: 'border-white/15 text-zinc-300 hover:bg-white/5' },
    error: { text: 'Not saving', dot: 'bg-amber-400', cls: 'border-amber-300/40 text-amber-200 hover:bg-amber-400/10' },
  }[sync] || { text: sync, dot: 'bg-zinc-400', cls: 'border-white/15 text-zinc-200' };
  return (
    <button type="button" onClick={onClick} className={`flex items-center gap-2 rounded-full border bg-white/5 px-3 py-1.5 text-xs font-medium transition ${cfg.cls}`} aria-label={`Database status: ${cfg.text}`}>
      <span className={`w-2 h-2 rounded-full ${cfg.dot}`} />{cfg.text}
    </button>
  );
}

function StatusModal({ sync, syncMsg, onClose, onRetry }) {
  useEffect(() => { const k = (e) => { if (e.key === 'Escape') onClose(); }; window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [onClose]);
  const good = sync === 'live' || sync === 'saving';
  return (
    <div className="fixed inset-0 z-[60] grid place-items-center p-4 bg-black/70 backdrop-blur-sm" onClick={onClose}>
      <div className={`${glass} w-full max-w-sm p-6`} onClick={(e) => e.stopPropagation()} role="dialog" aria-modal="true" aria-label="Database status">
        <div className="flex items-start justify-between gap-3">
          <h2 className="text-lg font-semibold">Database</h2>
          <button className={btnIcon + ' !w-8 !h-8'} aria-label="Close" onClick={onClose}><Icon name="x" className="w-4 h-4" /></button>
        </div>
        <p className={`mt-3 text-sm ${good ? 'text-violet-200' : 'text-amber-200'}`}>
          {good ? 'Connected. Every change saves to Supabase within a second, and other open devices update live.' : (syncMsg || 'Connecting to Supabase…')}
        </p>
        {!good && <button className={btnPrimary + ' w-full mt-4'} onClick={() => { onRetry(); onClose(); }}>Retry now</button>}
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(p) { super(p); this.state = { err: null }; }
  static getDerivedStateFromError(err) { return { err }; }
  render() {
    if (!this.state.err) return this.props.children;
    return (
      <div className="min-h-screen grid place-items-center p-6">
        <div className={`${glass} p-6 max-w-md text-center`}>
          <h1 className="text-lg font-semibold">Something went wrong</h1>
          <p className="text-sm text-zinc-300 mt-2">{String(this.state.err.message || this.state.err)}</p>
          <button className={btnGhost + ' mt-4'} onClick={() => { try { localStorage.removeItem(STORE_KEY); } catch (e) {} location.reload(); }}>Reset saved data & reload</button>
        </div>
      </div>
    );
  }
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>
<script>
  setTimeout(function () {
    if (!window.React || !window.Recharts || !window.Babel) {
      document.getElementById('root').innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;color:#a1a1aa;font:500 14px Inter,system-ui,sans-serif;text-align:center;padding:24px">Couldn’t load the chart/React libraries.<br/>Check your connection and refresh.</div>';
    }
  }, 8000);
</script>
</body>
